name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**/*.md"
      - ".github/assets/**"
  pull_request:
    branches: [main, master]
    paths-ignore:
      - "**/*.md"
      - ".github/assets/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10.0.x
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          include-prerelease: true

      - name: Restore dependencies
        run: dotnet restore Promptino.slnx -r win-x64

      - name: Build
        run: dotnet build Promptino.slnx -c Release

      - name: Run tests
        run: dotnet test Promptino.App.Tests/Promptino.App.Tests.csproj -c Release

      - name: Publish (self-contained win-x64)
        run: dotnet publish Promptino.App/Promptino.App.csproj -c Release -p:PublishProfile=win-x64-release

      - name: Upload publish artifacts
        uses: actions/upload-artifact@v4
        with:
          name: promptino-win-x64
          path: Promptino.App/bin/Release/net10.0/publish/win-x64/
